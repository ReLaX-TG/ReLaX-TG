
<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="100"
     viewBox="0 0 1100 100">

  <defs>
    <linearGradient id="leftLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff304b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff304b" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="rightLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff304b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff304b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left fading line -->
  <rect x="30" y="48" width="270" height="3"
        fill="url(#leftLine)"/>

  <!-- Heading -->
  <text x="550" y="65"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="52"
        font-weight="bold"
        fill="#CC0000">
    Hi, I'm Viktor!
  </text>

  <!-- Right fading line -->
  <rect x="800" y="48" width="270" height="3"
        fill="url(#rightLine)"/>

</svg>
